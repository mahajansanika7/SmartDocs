<div class="auth-container">
  <h1>SmartDocs</h1>
  <h2>Login</h2>

  <form (ngSubmit)="login()">

    <input
      type="text"
      name="username"
      [(ngModel)]="username"
      placeholder="Username"
      required
    />

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Password"
      required
    />

    <button type="submit">
      Login
    </button>

  </form>

  @if (error) {
    <p class="error-message">
      {{ error }}
    </p>
  }

  <p>
    Don't have an account?
    <a routerLink="/register">Register</a>
  </p>
</div>
